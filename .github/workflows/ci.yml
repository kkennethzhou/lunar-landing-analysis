name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Generate terrain
        run: python -m lunar_lander.generate_world
        env:
          MUJOCO_GL: osmesa

      - name: Tests
        run: pytest -m "not slow" --cov=lunar_lander --cov-report=term-missing
        env:
          MUJOCO_GL: osmesa

      - name: Physics regression
        if: matrix.python-version == '3.11'
        run: pytest -m slow
        env:
          MUJOCO_GL: osmesa
